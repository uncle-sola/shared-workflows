name: Generate Terraform Docs
#on:
#  push:
#    branches: [ "master" ]

on:
  workflow_call:
    inputs:
      working-dir:
        description: Directory containing the Terraform files
        type: string
        default: ./terraform

permissions:
  contents: write

jobs:
  reusable-docs-wf:
    runs-on: ubuntu-latest  # Run the workflow on an Ubuntu runner

    steps:
      - uses: actions/checkout@v3  # Checkout the repository code
        with:
          ref: ${{ github.head_ref || github.ref_name }}  # Check out the real branch (not the PR merge commit) so docs can be pushed

      - name: Install Terraform Docs
        uses: terraform-docs/gh-actions@main  # Action to generate Terraform documentation
        with:
          working-dir: ${{ inputs.working-dir }}  # Directory containing the Terraform files
          output-file: README.md  # Update the README file with generated docs
          output-method: inject  # Inject the documentation into the README
          git-push: "true"
